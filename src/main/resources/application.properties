# Application Configuration Properties
spring.application.name=Quantity Measurement App
server.port=8080

# --- AWS MySQL Configuration ---
spring.datasource.url=jdbc:mysql://172.31.13.156:3306/quantity_db
spring.datasource.username=springuser
spring.datasource.password=admin
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# --- JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Updated to MySQL Dialect for AWS
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Connection Pool ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# --- Logging ---
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] [%thread] %logger{5}:%line - %msg%n